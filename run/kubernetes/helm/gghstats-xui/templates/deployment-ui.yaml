{{- if not .Values.gghstats.enabled }}
{{- if not .Values.xui.env.apiBase }}
{{- fail "gghstats.enabled=false requires xui.env.apiBase (absolute URL of an external gghstats API)" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gghstats-xui.uiName" . }}
  labels:
    {{- include "gghstats-xui.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.xui.replicaCount }}
  selector:
    matchLabels:
      {{- include "gghstats-xui.labels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "gghstats-xui.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: xui
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.xui.image.repository }}:{{ .Values.xui.image.tag }}"
          imagePullPolicy: {{ .Values.xui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.xui.service.targetPort | default 3000 }}
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PORT
              value: {{ .Values.xui.env.port | default "3000" | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: GGHSTATS_API_BASE
              value: {{ default (printf "http://%s:%s" (include "gghstats-xui.backendName" .) (.Values.gghstats.service.port | default 8080 | toString)) .Values.xui.env.apiBase | quote }}
            - name: GGHSTATS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.apiToken.secretName .Values.apiToken.existingSecret }}
                  key: {{ .Values.apiToken.secretKey }}
          resources:
            {{- toYaml .Values.xui.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
