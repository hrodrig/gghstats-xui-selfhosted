{{- if and .Values.gghstats.enabled (not .Values.gghstats.githubToken.existingSecret) .Values.gghstats.githubToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gghstats.githubToken.secretName }}
  labels:
    {{- include "gghstats-xui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.gghstats.githubToken.secretKey }}: {{ .Values.gghstats.githubToken.value | quote }}
{{- end }}
---
{{- if and (not .Values.apiToken.existingSecret) .Values.apiToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiToken.secretName }}
  labels:
    {{- include "gghstats-xui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiToken.secretKey }}: {{ .Values.apiToken.value | quote }}
{{- end }}
