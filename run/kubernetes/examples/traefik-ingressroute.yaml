# Example Traefik IngressRoutes for the gghstats-xui UI Service.
#
# OUT OF SCOPE for the Helm chart: Ingress / IngressRoute / DNS / TLS / cert-manager.
# The chart only exposes ClusterIP. Keep your edited copy under a personal data dir
# (e.g. ~/gghstats-xui-selfhosted-data/) — never commit site-specific hosts.
#
# Before apply:
#   1. Replace Host(`xui.example.com`) with your public hostname.
#   2. Set services[].name to <release>-gghstats-xui-ui (e.g. my-xui-gghstats-xui-ui).
#   3. Match entryPoints / certResolver to your Traefik install.
#   4. Middleware `redirect-to-https` must exist in the same namespace (or adjust the ref).
#
# Traefik v3 watches traefik.io/v1alpha1 only — not traefik.containo.us/v1alpha1.
# IngressRoute CRs usually live in the **app** namespace (same as the Service), even when
# the Traefik Deployment runs in another namespace (e.g. traefik).
#
#   mkdir -p ~/gghstats-xui-selfhosted-data
#   cp run/kubernetes/examples/traefik-ingressroute.yaml ~/gghstats-xui-selfhosted-data/traefik-ingressroute.yaml
#   # edit ~/gghstats-xui-selfhosted-data/traefik-ingressroute.yaml
#   kubectl apply -f ~/gghstats-xui-selfhosted-data/traefik-ingressroute.yaml
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gghstats-xui-http
  namespace: gghstats
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`xui.example.com`)
      middlewares:
        - name: redirect-to-https
      priority: 1
      services:
        - name: my-xui-gghstats-xui-ui
          port: 3000
          weight: 10
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gghstats-xui
  namespace: gghstats
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`xui.example.com`)
      services:
        - name: my-xui-gghstats-xui-ui
          port: 3000
  tls:
    certResolver: your-resolver
