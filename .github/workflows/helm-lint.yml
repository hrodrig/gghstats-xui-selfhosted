# Validates the gghstats-xui Helm chart on every pull_request (job name `validate`
# required by develop/main rulesets — do not add path filters on pull_request).
# Pushes to develop/main still skip when the chart is unchanged.
name: Helm chart

on:
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - "run/kubernetes/helm/**"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: run/kubernetes/helm/gghstats-xui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm template + kubeconform (default values)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (persistence disabled)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set gghstats.persistence.enabled=false | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (inline tokens)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set gghstats.githubToken.value=ci-placeholder-token \
            --set apiToken.value=ci-api-token | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (existing Secrets)
        run: |
          helm template test-rel "$CHART_DIR" --namespace test-ns \
            --set gghstats.githubToken.existingSecret=my-github-secret \
            --set apiToken.existingSecret=my-api-secret | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -
